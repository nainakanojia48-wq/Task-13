<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd Checker</title>
</head>
<body>
    <h1>Javascript- Check if anumber is Even or Odd</h1>
    <script>
        //using four different variables
        let num1 = 5;
        let num2 = 10;
        let num3 = 17;
        let num4 = 24;

        //number 1
        if (num1 % 2 === 0) {
            console.log("The number " + num1 + " is even");
        } else {
            console.log("The number " + num1 + " is odd"); 
        }

        //number 2
         if (num2 % 2 === 0) {
            console.log("The number " + num2 + " is even");
        } else {
            console.log("The number " + num2 + " is odd"); 
        }
    </script>
</body>
</html>
